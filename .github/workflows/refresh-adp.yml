name: Refresh half-PPR keeper ADP

on:
  schedule:
    # Daily through draft-prep season; weekly the rest of the year. The weekly
    # slot sits well clear of "Refresh league data" (Tuesdays ~12:11/13:11 UTC),
    # which runs the ADP step itself — two jobs pushing data/ at once would race.
    - cron: "41 13 * 5-8 *"
    - cron: "41 15 * 1-4,9-12 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-adp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh keeper ADP
        run: python -m pipeline.adp

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/adp.json
          if git diff --cached --quiet; then
            echo "No ADP changes."
          else
            git commit -m "chore: refresh half-PPR ADP ($(date -u +%Y-%m-%d))"
            # A delayed run can start after another job has already pushed.
            git pull --rebase --autostash origin main
            git push
          fi
