name: Refresh half-PPR keeper ADP

on:
  schedule:
    # Offseason only: ADP is draft value, and the next season's feed returns
    # 400s once the season starts. Daily through draft-prep season (May-Aug),
    # weekly on Tuesdays Feb-Apr. Nothing runs Sep-Jan.
    - cron: "41 13 * 5-8 *"
    - cron: "41 15 * 2-4 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-adp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh keeper ADP
        run: python -m pipeline.adp

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/adp.json
          if git diff --cached --quiet; then
            echo "No ADP changes."
          else
            git commit -m "chore: refresh half-PPR ADP ($(date -u +%Y-%m-%d))"
            # A delayed run can start after another job has already pushed.
            git pull --rebase --autostash origin main
            git push
          fi
