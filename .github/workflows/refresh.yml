name: Refresh league data

on:
  # Tuesdays at 8am Eastern during the season (Sep → Jan), so the week's
  # results land before anyone looks. Cron has no DST, so the hour is split by
  # month: 12:00 UTC while EDT is in effect, 13:00 UTC once EST starts in
  # November. The odd minute is deliberate — GitHub queues top-of-the-hour
  # schedules and has delayed this workflow by hours.
  schedule:
    - cron: "11 12 * 9,10 2"    # Sep-Oct  — 8:11am EDT
    - cron: "11 13 * 11,12 2"   # Nov-Dec  — 8:11am EST
    - cron: "11 13 * 1 2"       # Jan      — 8:11am EST
  # Allow manual runs
  workflow_dispatch:
    inputs:
      year:
        description: "Override CURRENT_YEAR (active season)"
        required: false
      next_year:
        description: "Override NEXT_YEAR (next draft year for ADP)"
        required: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          CURRENT_YEAR: ${{ inputs.year }}
          NEXT_YEAR: ${{ inputs.next_year }}
        run: python -m pipeline.build

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh league data ($(date -u +%Y-%m-%d))"
            # A delayed run can start after another job has already pushed.
            git pull --rebase --autostash origin main
            git push
          fi
